<section class="hero alt"><div class="wrap narrow" style="margin:0 auto;max-width:var(--max)"><h1>Recommend a speaker</h1><p class="lead">The African Business Trade Association welcomes speaker recommendations for its conferences, summits, and events, which showcase leading experts and influential thought leaders.</p></div></section><section><div class="wrap narrow" style="margin:0 auto"><form data-form="speaker" novalidate>
<div class="field"><label for="f-speaker_name">Speaker's name</label><input id="f-speaker_name" name="speaker_name" type="text" required placeholder=""></div><div class="field"><label for="f-speaker_role">Speaker's role and organisation</label><input id="f-speaker_role" name="speaker_role" type="text" required placeholder=""></div><div class="field"><label for="f-speaker_link">Link to the speaker's profile (for example LinkedIn) <span class="note">(optional)</span></label><input id="f-speaker_link" name="speaker_link" type="url" inputmode="url" placeholder="https://"></div><div class="field"><label for="f-message">Why would they be a good speaker?</label><textarea id="f-message" name="message" required placeholder=""></textarea></div><div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name" placeholder=""></div><div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@company.com"></div>
<div class="hp" aria-hidden="true"><label>Leave this empty<input name="company_website" tabindex="-1" autocomplete="off"></label></div>

<p class="note">We use your details only to respond to you. See our <a href="https://ami.abta.africa/privacy.html">privacy policy</a>.</p>
<button class="btn btn-indigo" type="submit" style="width:100%">Send recommendation</button>
<div class="msg" role="status" aria-live="polite"></div>
</form></div></section>
